<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    {% if users and users|length > 0 %}
        <div class="container">
            <label for="username" id="labelUsername">
                Введите имя пользователя
            </label>
            <input class="block_element" type="text" id="username" tabindex="0" aria-label="labelUsername">
            
            <button class="block_element submit-btn" onclick="redirectToPage" tabindex="0">
                Войти/Зарегистрироваться
            </button>
            <script>
                function redirectToPage() {
                    const username = document.getElementById('username').value;
                    if (username.trim()) {
                        window.location.href = `/expanses?username=${encodeURIComponent(username)}`;
                    } else {
                        alert('Пожалуйста, введите имя пользователя');
                    }
                }
            </script>
        </div>
        <div class="container">
            <table>
                <thead>
                    <tr>
                        <th>Имя пользователя:</th>
                        <th>Расходы за последний месяц:</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.name }}</td>
                        <td>{{ user.lastMonthExpensesSum }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
    </div>
    {% else %}
        <div class="container">
            <p>Ошибка</p>
        </div>
   {% endif %}
</body>
</html>
