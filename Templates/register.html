<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/styles.css">
    <title>Регистрация</title>
</head>

<body>
    <div class="container">
        <h2>Регистрация</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <form method="POST" action="/register">
            <input class="block_element" type="text" name="username" placeholder="Имя пользователя" required>
            <input class="block_element" type="password" name="password" placeholder="Пароль" required>
            <button class="block_element submit-btn" type="submit">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
        <p><a href="/">На главную</a></p>
    </div>
</body>

</html>
