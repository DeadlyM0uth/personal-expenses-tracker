<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <!-- Форма добавления/редактирования -->
    <div class="container" id="expenseForm" style="display: none;">
        <input type="hidden" id="editId">
        <input class="block_element" type="date" id="inputDate" placeholder="Дата">
        <input class="block_element" type="number" id="inputSum" placeholder="Сумма">
        <input class="block_element" type="text" id="inputCategory" placeholder="Категория">
        <input class="block_element" type="text" id="inputPayment" placeholder="Способ оплаты">
        <input class="block_element" type="text" id="inputComment" placeholder="Комментарий">
        <button id="saveBtn">Сохранить</button>
        <button id="cancelBtn">Отмена</button>
    </div>

    <!-- Кнопка добавления -->
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <button id="addBtn">Добавить расход</button>
        <a href="{{ url_for('logout') }}">Выйти</a>
    </div>

    {% if expenses and expenses|length > 0 %}
    <!-- Фильтры -->
    <div class="container">
        <input class="block_element" type="date" id="startDate">
        <input class="block_element" type="date" id="endDate">
        <input class="block_element" type="text" id="expanseCategory" placeholder="Категория">
        <button id="acceptFilter">Применить</button>
    </div>

    <!-- Таблица -->
    <table class="container" id="expansesTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Дата ⇅</th>
                <th onclick="sortTable(1)">Сумма ⇅</th>
                <th onclick="sortTable(2)">Категория ⇅</th>
                <th onclick="sortTable(3)">Способ оплаты ⇅</th>
                <th>Комментарий</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const expensesData = {{ expenses| tojson }};
        const userId = {{ user.id }};
        let currentSort = { col: -1, asc: true };

        function renderTable(data) {
            const tbody = document.querySelector('#expansesTable tbody');
            tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.date}</td>
                        <td>${item.amount}</td>
                        <td>${item.category}</td>
                        <td>${item.payment_method}</td>
                        <td>${item.comment || ''}</td>
                        <td>
                            <button onclick="editExpense(${item.id})">✏️</button>
                            <button onclick="deleteExpense(${item.id})">❌</button>
                        </td>
                    </tr>
                `).join('');
        }

        function sortTable(col) {
            currentSort.asc = (currentSort.col === col) ? !currentSort.asc : true;
            currentSort.col = col;

            expansesData.sort((a, b) => {
                const valA = Object.values(a)[col];
                const valB = Object.values(b)[col];
                return currentSort.asc ?
                    (valA > valB ? 1 : -1) :
                    (valA < valB ? 1 : -1);
            });
            renderTable(expensesData);
        }

        async function deleteExpense(id) {
            if (!confirm('Удалить запись?')) return;

            try {
                const res = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    location.reload();
                } else {
                    alert('Ошибка удаления');
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка сети');
            }
        }

        function filterExpenses() {
            const category = document.getElementById("expanseCategory").value.toLowerCase();
            const start = document.getElementById("startDate").value;
            const end = document.getElementById("endDate").value;

            return expensesData.filter(e =>
                (!category || e.category.toLowerCase().includes(category)) &&
                (!start || e.date >= start) &&
                (!end || e.date <= end)
            );
        }

        // Управление формой
        document.getElementById('addBtn').onclick = () => {
            document.getElementById('expenseForm').style.display = 'block';
        };

        document.getElementById('cancelBtn').onclick = () => {
            document.getElementById('expenseForm').style.display = 'none';
            document.getElementById('editId').value = '';
        };

        document.getElementById('saveBtn').onclick = async () => {
            const id = document.getElementById('editId').value;
            const data = {
                date: document.getElementById('inputDate').value,
                amount: parseFloat(document.getElementById('inputSum').value),
                category: document.getElementById('inputCategory').value,
                payment_method: document.getElementById('inputPayment').value,
                comment: document.getElementById('inputComment').value,
                user_id: userId
            };

            const url = id ? `/api/expenses/${id}` : '/api/expenses';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    location.reload();
                } else {
                    const err = await res.json();
                    alert('Ошибка: ' + (err.error || 'Неизвестная ошибка'));
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка сети');
            }
        };

        function editExpense(id) {
            const expense = expensesData.find(e => e.id == id);
            if (expense) {
                document.getElementById('editId').value = expense.id;
                // Format date to ISO for input type date if needed, typically YYYY-MM-DD
                // Our API returns ISO with time potentially. input type=date needs YYYY-MM-DD
                document.getElementById('inputDate').value = expense.date ? expense.date.split('T')[0] : '';
                document.getElementById('inputSum').value = expense.amount;
                document.getElementById('inputCategory').value = expense.category;
                document.getElementById('inputPayment').value = expense.payment_method;
                document.getElementById('inputComment').value = expense.comment || '';
                document.getElementById('expenseForm').style.display = 'block';
            }
        }

        // Инициализация
        document.getElementById("acceptFilter").onclick = () => {
            renderTable(filterExpenses());
        };
        renderTable(expensesData);
    </script>
    {% else %}
    <div class="container">
        <p>Нет данных о расходах</p>
    </div>
    {% endif %}
</body>

</html>
